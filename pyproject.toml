[project]
name = "fx"
version = "0.1.0"
description = "获取网页汇率并生成邮件发送当日汇率报告"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "holidays>=0.30",
    "playwright>=1.63.0",
]

[project.scripts]
fxmail = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
